<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkPilot – Trending Videos</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #0f0f0f;
  color: #ffffff;
}

header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #222;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin-top: 8px;
  color: #aaa;
  font-size: 14px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.card {
  background: #151515;
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card h3 {
  font-size: 16px;
  margin: 0 0 10px 0;
}

.card p {
  font-size: 13px;
  color: #aaa;
  flex-grow: 1;
}

.card a {
  display: block;
  margin-top: 12px;
  text-align: center;
  padding: 10px;
  background: #1e90ff;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-weight: 500;
}

.card a:hover {
  background: #1877d6;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #777;
  border-top: 1px solid #222;
}
</style>
</head>

<body>

<header>
  <h1>LinkPilot</h1>
  <p>Trending videos curated for you</p>
</header>

<div class="container">
  <div class="grid">

    <!-- VIDEO CARD 1 -->
    <div class="card">
      <h3>Video 1 – Trending Now</h3>
      <p>Watch the latest trending video.</p>
      <a href="/video_1">Watch Now</a>
    </div>


  </div>
</div>

<footer>
  © 2026 LinkPilot.site · All rights reserved
</footer>

</body>
</html>
