<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: #0f0f0f;
  font-family: Arial, sans-serif;
  color: #fff;
}

/* ===== CONTAINER ===== */
#main-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
}

/* ===== VIDEO SECTION ===== */
#video-section {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

#video-wrapper {
  position: relative;
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1 / 1;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

/* Disable fullscreen and download buttons */
video::-webkit-media-controls-fullscreen-button {
  display: none !important;
}

video::-moz-media-controls-fullscreen-button {
  display: none !important;
}

video::-webkit-media-controls-download-button {
  display: none !important;
}

video::-internal-media-controls-download-button {
  display: none !important;
}

/* ===== CONTENT SECTION ===== */
#content-section {
  background: #1a1a1a;
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.content-info {
  text-align: center;
  padding: 30px;
  max-width: 600px;
}

.content-info h2 {
  color: #fff;
  font-size: 28px;
  margin-bottom: 15px;
}

.content-info p {
  color: #aaa;
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.ad-zone {
  width: 100%;
  max-width: 800px;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Error message */
.error-message {
  text-align: center;
  padding: 40px;
  color: #ff6b6b;
}

.error-message h3 {
  font-size: 24px;
  margin-bottom: 10px;
}

/* ===== RESPONSIVE DESIGN ===== */

/* Desktop/Tablet landscape - side by side */
@media (min-width: 1024px) and (orientation: landscape) {
  #main-container {
    flex-direction: row;
    height: 100vh;
  }
  
  #video-section {
    flex: 0 0 50%;
    height: 100vh;
    padding: 20px;
  }
  
  #video-wrapper {
    max-width: min(80vh, 600px);
    max-height: 80vh;
  }
  
  #content-section {
    flex: 0 0 50%;
    height: 100vh;
  }
}

/* Tablet portrait */
@media (min-width: 768px) and (max-width: 1023px) {
  #video-section {
    padding: 15px;
    height: 50vh;
  }
  
  #video-wrapper {
    max-width: 500px;
    max-height: 45vh;
  }
  
  #content-section {
    height: 50vh;
  }
  
  .content-info h2 {
    font-size: 24px;
  }
  
  .content-info p {
    font-size: 15px;
  }
}

/* Mobile landscape */
@media (max-width: 767px) and (orientation: landscape) {
  #main-container {
    flex-direction: row;
    height: 100vh;
  }
  
  #video-section {
    flex: 0 0 45%;
    height: 100vh;
    padding: 5px;
  }
  
  #video-wrapper {
    max-width: 90vh;
    max-height: 90vh;
  }
  
  #content-section {
    flex: 0 0 55%;
    height: 100vh;
  }
  
  .content-info {
    padding: 15px;
  }
  
  .content-info h2 {
    font-size: 20px;
  }
  
  .content-info p {
    font-size: 14px;
  }
  
  .ad-zone {
    min-height: 200px;
    padding: 10px;
  }
}

/* Mobile portrait */
@media (max-width: 767px) and (orientation: portrait) {
  #video-section {
    padding: 8px;
    height: 50vh;
  }
  
  #video-wrapper {
    max-width: 95vw;
    max-height: 45vh;
  }
  
  #content-section {
    height: 50vh;
  }
  
  .content-info {
    padding: 20px;
  }
  
  .content-info h2 {
    font-size: 22px;
  }
  
  .content-info p {
    font-size: 14px;
  }
}

/* Small mobile devices */
@media (max-width: 480px) {
  #video-section {
    padding: 5px;
    height: 45vh;
  }
  
  #video-wrapper {
    max-width: 98vw;
    max-height: 42vh;
  }
  
  #content-section {
    height: 55vh;
  }
  
  .content-info {
    padding: 15px;
  }
  
  .content-info h2 {
    font-size: 20px;
  }
  
  .content-info p {
    font-size: 13px;
  }
  
  .ad-zone {
    min-height: 150px;
    padding: 10px;
  }
}

/* Loading overlay */
#loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0f0f0f;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease;
}

.loader {
  width: 50px;
  height: 50px;
  border: 4px solid #333;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="loader"></div>
</div>

<!-- Main Container -->
<div id="main-container">
  <!-- VIDEO SECTION -->
  <div id="video-section">
    <div id="video-wrapper">
      <video id="videoPlayer"
             controls
             autoplay
             muted
             playsinline
             loop
             controlslist="nodownload nofullscreen noremoteplayback"
             disablepictureinpicture>
        <!-- Video source will be set dynamically -->
        Your browser does not support video.
      </video>
    </div>
  </div>

  <!-- CONTENT SECTION -->
  <div id="content-section">
    <div class="content-info">
      <h2>Enjoy Your Content</h2>
      <p>Watch the video above and explore more content. Click anywhere to discover additional features.</p>
    </div>
    
    <!-- Ad Zone -->
    <div class="ad-zone" id="ad-zone">
      <!-- OnClickA ads will trigger on user clicks -->
    </div>
  </div>
</div>

<!-- ===== ONCLICKA AD SCRIPT ===== -->
<script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="409201"></script>

<!-- ===== MAIN SCRIPT ===== -->
<script>
// Get video URL from query parameter
function getVideoUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  const videoParam = urlParams.get('v') || urlParams.get('video');
  
  if (videoParam) {
    // If it's a full URL, use it directly
    if (videoParam.startsWith('http://') || videoParam.startsWith('https://')) {
      return videoParam;
    }
    // If it's just an ID or partial URL, construct the full URL
    // Adjust this based on your video hosting setup
    return `https://vz-148705f6-876.b-cdn.net/${videoParam}/playlist.m3u8`;
  }
  
  // Default video if no parameter provided
  return 'https://vz-148705f6-876.b-cdn.net/83ee655b-2133-4f97-b28f-42357bee2696/playlist.m3u8';
}

const video = document.getElementById("videoPlayer");
const loadingOverlay = document.getElementById("loading-overlay");

// Set video source
const videoUrl = getVideoUrl();
const source = document.createElement('source');
source.src = videoUrl;
source.type = 'application/x-mpegURL';
video.appendChild(source);

console.log('Loading video:', videoUrl);

// Disable right click on video
video.oncontextmenu = e => e.preventDefault();

// Prevent fullscreen via keyboard and events
video.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  }
});

video.addEventListener('webkitfullscreenchange', () => {
  if (document.webkitFullscreenElement) {
    document.webkitExitFullscreen();
  }
});

video.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
  }
});

// Prevent context menu on video
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'VIDEO') {
    e.preventDefault();
  }
});

// Hide loading overlay
function hideLoading() {
  setTimeout(() => {
    loadingOverlay.classList.add('loading-hidden');
    setTimeout(() => {
      loadingOverlay.style.display = 'none';
    }, 500);
  }, 800);
}

// Start everything on page load
window.addEventListener('DOMContentLoaded', () => {
  // Start video playback
  video.play()
    .then(() => {
      console.log('Video started playing');
      hideLoading();
    })
    .catch(err => {
      console.log("Autoplay prevented:", err);
      hideLoading();
    });
  
  // Log OnClickA script load
  console.log('OnClickA ad script loaded');
});

// Ensure video plays on user interaction if autoplay failed
let hasInteracted = false;
const ensurePlay = () => {
  if (!hasInteracted && video.paused) {
    video.play()
      .then(() => {
        console.log('Video playing after interaction');
      })
      .catch(err => {
        console.log("Play error:", err);
      });
    hasInteracted = true;
  }
};

// Add interaction listeners
document.addEventListener('click', ensurePlay, { once: true });
document.addEventListener('touchstart', ensurePlay, { once: true });

// Handle video errors
video.addEventListener('error', (e) => {
  console.error('Video error:', e);
  const errorMsg = document.createElement('div');
  errorMsg.className = 'error-message';
  errorMsg.innerHTML = `
    <h3>⚠️ Video Load Error</h3>
    <p>Unable to load video. Please check the URL.</p>
    <p style="font-size: 12px; color: #666; margin-top: 10px;">URL: ${videoUrl}</p>
  `;
  document.querySelector('.content-info').appendChild(errorMsg);
  hideLoading();
});

// Handle video loaded
video.addEventListener('loadeddata', () => {
  console.log('Video loaded successfully');
});

// Handle orientation changes
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 100);
});

// Log ad clicks (for debugging)
let clickCount = 0;
document.addEventListener('click', (e) => {
  clickCount++;
  console.log('Click detected - OnClickA ad may trigger. Total clicks:', clickCount);
});
</script>

</body>
</html>
